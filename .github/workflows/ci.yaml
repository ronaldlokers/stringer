name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The tests run again inside the image, on both architectures, because that
  # is the only place they can catch a base that stopped shipping the zone
  # database. A missing tzdata does not crash — every day comes out 24 hours
  # long and the wrong day gets reported, so the DST assertions are the guard.
  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this architecture and prove the zones
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stringer:ci

      - name: Days are the length the calendar says
        run: |
          set -euo pipefail
          for date_and_hours in 2026-03-29:23 2026-10-25:25 2026-08-05:24; do
            date="${date_and_hours%:*}"
            hours="${date_and_hours#*:}"
            out=$(docker run --rm -e DIGEST_DATE="$date" stringer:ci hello)
            echo "$out"
            grep -q "was ${hours} hours long" <<<"$out" \
              || { echo "::error::${date} should be ${hours} hours"; exit 1; }
          done

      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures are mandatory: staging is amd64 and production is
      # arm64, so a single-arch image would pass in staging and fail on the Pis.
      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
